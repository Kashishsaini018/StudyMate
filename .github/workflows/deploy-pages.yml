name: Deploy StudyMate to GitHub Pages

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production
        uses: actions/checkout@v4
        with:
          ref: main
          path: source/main

      - name: Check out staging
        uses: actions/checkout@v4
        with:
          ref: staging
          path: source/staging

      - name: Assemble production and beta sites
        run: |
          mkdir -p public/beta
          tar --exclude='.git' --exclude='.github' -cf - -C source/main . | tar -xf - -C public
          tar --exclude='.git' --exclude='.github' -cf - -C source/staging . | tar -xf - -C public/beta
          touch public/.nojekyll
          touch public/beta/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
